[project]
name = "coding-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Suyash", email = "suyashrusia2005@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "ipython>=9.17.1",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.12",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
coding-agent = "coding_agent:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["."]